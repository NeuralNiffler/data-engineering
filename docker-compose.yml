services:
  warehouse:
    image: postgres:17
    container_name: dae-warehouse
    environment:
      POSTGRES_USER: ${DWH_DB_USER}
      POSTGRES_PASSWORD: ${DWH_DB_PW}
      POSTGRES_DB: ${DWH_DB_NAME}
    ports:
      - "${DWH_DB_PORT}:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_DB_USER} -d ${DWH_DB_NAME}"]
      interval: 5s
      retries: 5

volumes:
  dwh_data: